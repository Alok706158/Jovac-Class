<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather & Latest News</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#0d1117;
    color:#fff;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#6ea8ff;
}

.time{
    color:#8b95a7;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box input{
    flex:1;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#151b28;
    color:white;
    border:1px solid #273043;
}

.search-box button{
    padding:14px 30px;
    border:none;
    border-radius:12px;
    background:#4f7cff;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.search-box button:hover{
    background:#396cff;
}

.main{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
}

.weather-card{
    background:#171c29;
    border-radius:18px;
    padding:25px;
}

.weather-title{
    font-size:12px;
    color:#8a93a5;
    margin-bottom:15px;
}

.weather-main{
    display:flex;
    align-items:center;
    gap:10px;
}

.weather-main img{
    width:70px;
}

.temp{
    font-size:60px;
    font-weight:bold;
}

.city{
    margin-top:10px;
    font-size:22px;
}

.condition{
    color:#9ca6b8;
}

.stats{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.stat{
    flex:1;
    background:#0d1117;
    padding:15px;
    border-radius:12px;
}

.stat span{
    color:#8a93a5;
    font-size:12px;
}

.stat h4{
    margin-top:5px;
}

.forecast{
    background:#171c29;
    border-radius:18px;
    padding:20px;
    margin-top:20px;
}

.forecast-title{
    font-size:12px;
    color:#8a93a5;
    margin-bottom:15px;
}

.forecast-cards{
    display:flex;
    gap:10px;
}

.forecast-item{
    flex:1;
    background:#0d1117;
    text-align:center;
    padding:10px;
    border-radius:12px;
}

.forecast-item img{
    width:45px;
}

.news-section h3{
    color:#8a93a5;
    margin-bottom:15px;
    font-size:13px;
    letter-spacing:1px;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.news-card{
    background:#171c29;
    border-radius:16px;
    padding:18px;
    transition:.3s;
}

.news-card:hover{
    transform:translateY(-3px);
}

.news-source{
    color:#4f7cff;
    font-size:11px;
    font-weight:bold;
    margin-bottom:10px;
}

.news-card a{
    text-decoration:none;
    color:white;
    font-weight:600;
    line-height:1.4;
}

.news-date{
    margin-top:12px;
    color:#8a93a5;
    font-size:12px;
}

.error{
    color:#ff6b6b;
    margin-top:10px;
}

@media(max-width:900px){

.main{
    grid-template-columns:1fr;
}

.news-grid{
    grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<div class="container">

<header>
    <div class="logo">Weather & Latest News</div>
    <div class="time" id="time"></div>
</header>

<div class="search-box">
    <input type="text" id="city" placeholder="Type city name">
    <button onclick="getWeather()">Search</button>
</div>

<div class="error" id="error"></div>

<div class="main">

    <div>

        <div class="weather-card">

            <div class="weather-title">
                CURRENT WEATHER
            </div>

            <div class="weather-main">
                <img id="icon">
                <div id="temp" class="temp">--°</div>
            </div>

            <div id="cityName" class="city">
                City
            </div>

            <div id="condition" class="condition">
                Condition
            </div>

            <div class="stats">

                <div class="stat">
                    <span>HUMIDITY</span>
                    <h4 id="humidity">--%</h4>
                </div>

                <div class="stat">
                    <span>WIND</span>
                    <h4 id="wind">-- km/h</h4>
                </div>

            </div>

        </div>

        <div class="forecast">

            <div class="forecast-title">
                DAY FORECAST
            </div>

            <div class="forecast-cards" id="forecastCards">

            </div>

        </div>

    </div>

    <div class="news-section">

        <h3>TOP HEADLINES</h3>

        <div class="news-grid" id="news">

        </div>

    </div>

</div>

</div>

<script>

const WEATHER_API_KEY = "8c9c8083fff1487da5a91933262306";

function updateTime(){

    const now = new Date();

    document.getElementById("time").innerText =
    "Updated " +
    now.toLocaleTimeString([],{
        hour:'2-digit',
        minute:'2-digit'
    });

}

setInterval(updateTime,1000);
updateTime();

async function getWeather(){

    const city =
    document.getElementById("city").value.trim();

    if(!city){
        alert("Enter city name");
        return;
    }

    try{

        const response = await fetch(
        `https://api.weatherapi.com/v1/forecast.json?key=${WEATHER_API_KEY}&q=${city}&days=3&aqi=no`
        );

        const data = await response.json();

        if(data.error){

            document.getElementById("error").innerText =
            data.error.message;

            return;
        }

        document.getElementById("error").innerText = "";

        document.getElementById("cityName").innerText =
        `${data.location.name}, ${data.location.country}`;

        document.getElementById("temp").innerText =
        `${Math.round(data.current.temp_c)}°C`;

        document.getElementById("condition").innerText =
        data.current.condition.text;

        document.getElementById("humidity").innerText =
        data.current.humidity + "%";

        document.getElementById("wind").innerText =
        data.current.wind_kph + " km/h";

        document.getElementById("icon").src =
        "https:" + data.current.condition.icon;

        createForecast(data.forecast.forecastday);

        getNews(city);

    }
    catch(err){

        console.log(err);

        document.getElementById("error").innerText =
        "Weather loading failed";

    }

}

function createForecast(days){

    let html = "";

    days.forEach(day=>{

        const d =
        new Date(day.date);

        const dayName =
        d.toLocaleDateString("en-US",{
            weekday:"short"
        });

        html += `
        <div class="forecast-item">

            <div>${dayName}</div>

            <img src="https:${day.day.condition.icon}">

            <div>
                ${Math.round(day.day.maxtemp_c)}°
                /
                ${Math.round(day.day.mintemp_c)}°
            </div>

        </div>
        `;

    });

    document.getElementById("forecastCards").innerHTML =
    html;

}

async function getNews(city){

    const newsDiv =
    document.getElementById("news");

    newsDiv.innerHTML =
    "<p>Loading news...</p>";

    try{

        const rssUrl =
        `https://news.google.com/rss/search?q=${encodeURIComponent(city)}`;

        const response =
        await fetch(
        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`
        );

        const data =
        await response.json();

        let html = "";

        if(data.items){

            data.items.slice(0,6).forEach(article=>{

                html += `
                <div class="news-card">

                    <div class="news-source">
                        NEWS
                    </div>

                    <a href="${article.link}"
                    target="_blank">

                    ${article.title}

                    </a>

                    <div class="news-date">
                        ${article.pubDate}
                    </div>

                </div>
                `;

            });

        }

        newsDiv.innerHTML = html;

    }
    catch(error){

        console.log(error);

        newsDiv.innerHTML =
        "<p>Failed to load news</p>";

    }

}

document.getElementById("city")
.addEventListener("keypress",e=>{

    if(e.key==="Enter"){
        getWeather();
    }

});


</script>

</body>
</html>
