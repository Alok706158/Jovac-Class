<html>
  <head>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <div class="container">
      <h1>Todo List</h1>
      <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter List" />
        <button id="addBtn">Add Task</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <script>
      const taskInput = document.getElementById("taskInput");
      const addBtn = document.getElementById("addBtn");
      const taskList = document.getElementById("taskList");

      // NEW: Local Storage se tasks load karo
      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

      // NEW: Page load hote hi sab tasks screen par dikhao
      tasks.forEach((task) => createTask(task));

      addBtn.addEventListener("click", addTask);

      function addTask() {
        const task = taskInput.value.trim();

        if (task === "") {
          alert("Please enter a task");
          return;
        }

        // NEW: Array me task add karo
        tasks.push(task);

        // NEW: Updated array ko Local Storage me save karo
        localStorage.setItem("tasks", JSON.stringify(tasks));

        // Screen par task dikhao
        createTask(task);

        taskInput.value = "";
        taskInput.focus();
      }

      function createTask(task) {
        const li = document.createElement("li");

        const text = document.createElement("span");
        text.textContent = task;

        const actions = document.createElement("div");
        actions.className = "actions";

        const completeBtn = document.createElement("button");
        completeBtn.textContent = "Done";
        completeBtn.className = "complete";

        completeBtn.addEventListener("click", function () {
          text.classList.toggle("completed");
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "delete";

        deleteBtn.addEventListener("click", function () {
          // Screen se task delete
          li.remove();

          // NEW: Array se bhi task delete karo
          tasks = tasks.filter((t) => t !== task);

          // NEW: Updated array ko dobara Local Storage me save karo
          localStorage.setItem("tasks", JSON.stringify(tasks));
        });

        actions.appendChild(completeBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(text);
        li.appendChild(actions);

        taskList.appendChild(li);
      }
    </script>
  </body>
</html>
