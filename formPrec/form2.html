<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Registration Form</h1>
        <p>fill the form correctly in bellow</p>
      </div>
      <form id="registerForm">
        <div class="input-group">
          <label for="firstName">First Name</label>
          <input
            type="text"
            id="firstName"
            placeholder="Enter Your First Name"
          />
        </div>

        <div class="input-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" placeholder="Enter your Last Name" />
        </div>

        <div class="input-group">
          <label for="emailId">Email Id</label>
          <input type="text" id="emailId" placeholder="Enter valid Email Id" />
        </div>

        <div class="input-group">
          <label for="phoneNo">Phone Number</label>
          <input type="tel" id="phoneNo" placeholder="Enter Phone Number" />
        </div>

        <div class="input-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" placeholder="dd-mm-yyyy" />
        </div>

        <div class="input-group">
          <label>Gender</label>
          <div class="gender">
            <label>
              <input type="radio" name="gender" value="Male" />Male
            </label>
            <label>
              <input type="radio" name="gender" value="Female" />Female
            </label>
            <label>
              <input type="radio" name="gender" value="other" />Other
            </label>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="new-password" />
        </div>
        <div class="input-group">
          <label for="confirm password">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter Confirm Password"
          />
        </div>

        <div class="input-group">
          <input type="checkbox" id="terms" />
          <label for="terms">I agree to the Terms & Condition</label>
        </div>

        <button type="submit" id="registerBtn">Register</button>
      </form>
    </div>
    <script src="script2.js"></script>

  </body>
</html>
