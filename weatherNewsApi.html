<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather & City News</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eaf4ff;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:20px;
}

.container{
    width:450px;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-bottom:15px;
}

.search{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:10px 15px;
    border:none;
    background:#007bff;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.card{
    display:none;
    text-align:center;
    margin-top:20px;
}

.card img{
    width:80px;
}

.temp{
    font-size:40px;
    font-weight:bold;
}

.error{
    color:red;
    margin-top:10px;
}

#news{
    margin-top:20px;
}

.news-card{
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

.news-card img{
    width:100%;
    border-radius:8px;
    margin-bottom:8px;
}

.news-card a{
    color:#007bff;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

    <h2>Weather + City News</h2>

    <div class="search">
        <input type="text" id="city" placeholder="Enter City">
        <button onclick="getWeather()">Search</button>
    </div>

    <div id="error" class="error"></div>

    <div id="card" class="card">
        <h3 id="cityName"></h3>
        <img id="icon" alt="">
        <div id="temp" class="temp"></div>
        <p id="condition"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
    </div>

    <div id="news"></div>

</div>

<script>
const WEATHER_API_KEY = "8c9c8083fff1487da5a91933262306";
const NEWS_API_KEY = "3bef64a9323fe6cc18c09e6a7b0741d6";

async function getWeather() {

    const city = document.getElementById("city").value.trim();

    if (!city) {
        alert("Please enter a city name");
        return;
    }

    try {

        const response = await fetch(
            `https://api.weatherapi.com/v1/current.json?key=${WEATHER_API_KEY}&q=${city}&aqi=no`
        );

        const data = await response.json();

        if (data.error) {
            document.getElementById("error").innerText = data.error.message;
            return;
        }

        document.getElementById("error").innerText = "";
        document.getElementById("card").style.display = "block";

        document.getElementById("cityName").innerText =
            `${data.location.name}, ${data.location.country}`;

        document.getElementById("temp").innerText =
            `${data.current.temp_c}°C`;

        document.getElementById("condition").innerText =
            data.current.condition.text;

        document.getElementById("humidity").innerText =
            `Humidity: ${data.current.humidity}%`;

        document.getElementById("wind").innerText =
            `Wind: ${data.current.wind_kph} km/h`;

        document.getElementById("icon").src =
            "https:" + data.current.condition.icon;

        getNews(city);

    } catch (error) {

        console.error(error);

        document.getElementById("error").innerText =
            "Weather loading failed";
    }
}

async function getNews(city){

    const newsDiv = document.getElementById("news");

    newsDiv.innerHTML =
    "<h3>Latest News</h3><p>Loading...</p>";

    try{

        const rssUrl =
        `https://news.google.com/rss/search?q=${encodeURIComponent(city)}`;

        const response = await fetch(
        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`
        );

        const data = await response.json();

        let html = "<h3>Latest News</h3>";

        if(data.items && data.items.length > 0){

            data.items.slice(0,5).forEach(article => {

                html += `
                <div class="news-card">

                    <a href="${article.link}" target="_blank">
                        ${article.title}
                    </a>

                    <p style="margin-top:8px;">
                        ${article.description
                            .replace(/<[^>]*>/g,'')
                            .substring(0,150)}...
                    </p>

                </div>
                `;
            });

        }else{

            html += "<p>No news found.</p>";
        }

        newsDiv.innerHTML = html;

    }catch(error){

        console.error(error);

        newsDiv.innerHTML =
        "<p style='color:red'>Failed to load news.</p>";
    }
}
document.getElementById("city").addEventListener("keypress", function (e) {

    if (e.key === "Enter") {
        getWeather();
    }

});

</script>

</body>
</html>
