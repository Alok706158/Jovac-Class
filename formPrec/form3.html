<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 3</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Register Form</h1>
            <p>Enter all document correctly in below</p> 
        </div>
        <form id="registerForm">
            <div class="input-group">
                <label for="firstName" >First Name</label>
                <input type="text" id="firstName" placeholder="Enter First Name">
            </div>

            <div class="input-group">
                <label for="lastName" >Last Name</label>
                <input type="text" id="lastName" placeholder="Enter Last Name">
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Enter Email Id">
            </div>

            <div class="input-group">
                <label for="phoneNo">Phone Number</label>
                <input type="tel" id="phoneNo" placeholder="Enter your Phone Number">
            </div>

            <div class="input-group">
                <label for="dob" >Date of Birth</label>
                <input type="date" id="dob" placeholder="Enter Your Date of Birth">
            </div>

            <div class="input-group">
                <label for="gerder">Gender</label>
            </div>
            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="Male"> Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female">Female
                </label>
                <label>
                    <input type="radio" name="gernder" value="other">Other
                </label>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter 4 digit valid password">
            </div>

            <div class="input-group">
                <label for="confirmPass">Confirm password</label>
                <input type="password" id="confirmPass" placeholder="Enter Confirm Password">
            </div>

            <div class="input-group">
                <input type="checkbox" id="terms">
                <label for="terms">I Accept All Terms & Condition</label>
            </div>

            <button type="submit" id="registerBtn" >Register</button>

        </form>      
    </div>
</body>

<script>

    const form = document.getElementById("registerForm");

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const firstName=document.getElementById("firstName");
        const lastName= document.getElementById("lastName");
        const email= document.getElementById("email");
        const dob = document.getElementById("dob");
        const terms = document.getElementById("terms");
        const password= document.getElementById("password");
        const confirmPass = document.getElementById("confirmPass");
        const phoneNo= document.getElementById("phoneNo");

        const gender = document.querySelector('input[name="gender"]:checked');

        if (!gender) {
           alert("Select Gender");
           return;
        }

        if(firstName.value.trim() === ""){
            alert("Enter First Name");
            firstName.focus();
            return;
        }

        if(lastName.value.trim() === ""){
            alert("Enter Last Name");
            lastName.focus();
            return;
        }

        if(email.value.trim() === ""){
            alert("Enter email id");
            email.focus();
            return;
        }

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if(!emailPattern.test(email.value)){
            alert("Enter a valid email id");
            return;
        }

        const phonePattern =  /^[6-9]\d{9}$/;

        if(!phonePattern.test(phoneNo.value)){
            alert("Enter a valid 10 digit phone number");
            phonePattern.focus();
            return;
        }

        if(password.value.trim() < 4){
            alert("Enter 4 digit valid password");
            password.focus();
            return;

        }
        if(confirmPass.value !== password.value ){
            alert("Enter confirm Password");
            return;
        }
        if(!terms.checked){
            alert("Accept the therms and conditions");
            return;
        }

        //successful 
        alert("Register Successful");
        form.reset();


    })


    
</script>
</html>
